<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cartão Virtual Workin</title>
<style>
  :root {
    --ground: #f4f7f4; --ink: #22253A; --muted: #5c6b73;
    --accent: #00AD50; --brand: #22253A; --sans: 'Segoe UI', -apple-system, system-ui, Roboto, Arial, sans-serif;
  }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--ground); color: var(--ink); font-family: var(--sans); text-align: center; padding: 24px;
  }
  .box { max-width: 420px; }
  .badge {
    display: inline-flex; align-items: center; gap: 7px; margin-bottom: 16px;
    padding: 5px 11px; border-radius: 999px; background: #e2f5ea; color: var(--accent);
    font-size: 12px; font-weight: 600; letter-spacing: .02em;
  }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -.01em; }
  p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0; }
</style>
</head>
<body>
  <div class="box">
    <span class="badge">Cartão Virtual</span>
    <h1>Estamos preparando o seu cartão Workin</h1>
    <p>Esta página está em construção. Em breve, aqui você terá acesso ao cartão de contato digital da equipe Workin.</p>
  </div>
</body>
</html>
